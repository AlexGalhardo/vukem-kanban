appId: com.alexgalhardo.kanban
productName: Kanban
copyright: Copyright © 2026 Alex Galhardo
directories:
    output: dist/desktop
    buildResources: desktop/build
files:
    - desktop/dist/**
    - package.json
extraResources:
    - from: bin/
      to: bin/
      filter:
          - kanban
          - kanban.exe
asar: true
icon: desktop/build/icon.png
win:
    target:
        - target: nsis
          arch: [x64]
        - target: portable
          arch: [x64]
nsis:
    oneClick: false
    allowToChangeInstallationDirectory: true
    artifactName: ${productName}-Setup-${version}-${arch}.${ext}
portable:
    artifactName: ${productName}-${version}-${arch}-portable.${ext}
linux:
    target: [AppImage]
    category: Development
    artifactName: ${productName}-${version}-${arch}.${ext}
mac:
    target: [dmg]
    category: public.app-category.developer-tools
    artifactName: ${productName}-${version}-${arch}.${ext}
