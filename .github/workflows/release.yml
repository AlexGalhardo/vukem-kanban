name: Release

# The GitHub release and the desktop installers are published locally by
# `bun run release <version>` (scripts/release.ts). Pushing the resulting
# vX.Y.Z tag runs this workflow, which publishes the web image only.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The image goes to GHCR and Docker Hub, is smoke tested before anything is
  # pushed, and is signed and attested afterwards.
  image:
    name: Image to GHCR and Docker Hub, signed
    runs-on: ubuntu-latest
    env:
      GHCR_IMAGE: ghcr.io/alexgalhardo/vukem-kanban
      HUB_IMAGE: docker.io/${{ vars.DOCKERHUB_USERNAME }}/vukem-kanban
      TAG: ${{ github.ref_name }}
    permissions:
      contents: read
      packages: write # push the image to GHCR
      id-token: write # Sigstore OIDC identity for cosign and attestations
      attestations: write # build provenance attestation of the image
    steps:
      - name: Only a version tag releases
        run: |
          case "$GITHUB_REF" in refs/tags/v*) ;; *) echo "::error::run this workflow on a vX.Y.Z tag, not on $GITHUB_REF"; exit 1 ;; esac
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # X.Y.Z, X.Y and latest only for a stable tag. A pre-release such as
      # v0.9.0-beta.1 gets its own exact tag and must never move latest.
      - name: Resolve the image tags
        id: meta
        run: |
          version="${TAG#v}"
          tags=("$GHCR_IMAGE:$version" "$HUB_IMAGE:$version")
          if [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            for image in "$GHCR_IMAGE" "$HUB_IMAGE"; do
              tags+=("$image:${version%.*}" "$image:latest")
            done
          fi
          {
            echo "version=$version"
            echo "tags<<EOF"
            printf '%s\n' "${tags[@]}"
            echo "EOF"
          } >>"$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      # Smoke build: one platform, loaded into the local daemon, never pushed.
      # The push build below reuses its layers through the GitHub cache.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: smoke:vukem-kanban
          build-args: VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test the image
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          test "$(docker run --rm smoke:vukem-kanban --version)" = "$VERSION"
          docker run -d --name smoke -p 127.0.0.1:8080:8080 smoke:vukem-kanban
          for path in /healthz /; do
            code=000
            for _ in $(seq 1 30); do
              code="$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:8080$path" || true)"
              [ "$code" = 200 ] && break
              sleep 2
            done
            if [ "$code" != 200 ]; then
              echo "::error::the image answered $code on $path"
              docker logs smoke
              exit 1
            fi
          done
          docker rm -f smoke
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: build
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          sbom: true
          provenance: mode=max
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      # The same digest is in both registries, so each reference is signed.
      - name: Sign the image digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign sign --yes "$GHCR_IMAGE@$DIGEST"
          cosign sign --yes "$HUB_IMAGE@$DIGEST"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/alexgalhardo/vukem-kanban
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: docker.io/${{ vars.DOCKERHUB_USERNAME }}/vukem-kanban
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
